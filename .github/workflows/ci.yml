name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.25'] # floor + current
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Test (race)
        run: go test ./... -race -count=1 -timeout 300s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  # The whole test suite doubles as an integration test: every test that
  # normally runs against miniredis also runs against a real Redis and a
  # real Valkey server (same wire protocol, same Lua engine).
  integration:
    name: Integration (Redis & Valkey)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      valkey:
        image: valkey/valkey:8
        ports:
          - 6380:6379 # Valkey speaks the Redis protocol on its own 6379
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Test against Redis 7
        env:
          DISTSYNC_TEST_REDIS_ADDR: localhost:6379
        run: go test ./... -race -count=1 -timeout 300s
      - name: Test against Valkey 8
        env:
          DISTSYNC_TEST_REDIS_ADDR: localhost:6380
        run: go test ./... -race -count=1 -timeout 300s
